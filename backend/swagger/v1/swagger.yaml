                    type: string
                  visited_at:
                    type: string
                  reward_applied:
                    type: boolean
                  reward_description_snapshot:
                    type: string
                    nullable: true
                  created_at:
                    type: string
                  updated_at:
                    type: string
                required:
                - id
                - consumer_id
                - merchant_id
                - amount
                - visited_at
                - reward_applied
                - created_at
                - updated_at
        '401':
          description: not authenticated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '404':
          description: visit not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '422':
          description: validation failed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                visit:
                  type: object
                  properties:
                    amount:
                      type: number
                    visited_at:
                      type: string
    delete:
      summary: Soft-deletes a visit
      tags:
      - Visits
      security:
      - bearer_auth: []
      responses:
        '204':
          description: visit deleted
        '401':
          description: not authenticated
        '404':
          description: visit not found
servers:
- url: http://localhost:3000
  description: Local development
components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Consumer session token issued by POST /api/v1/registrations or
        POST /api/v1/sessions. Sent as `Authorization: Bearer <token>`.'
  schemas:
    error:
      type: object
      properties:
        error:
          type: string
      required:
      - error
    validation_errors:
      type: object
      properties:
        errors:
          type: object
      required:
      - errors
    pagination_meta:
      type: object
      properties:
        current_page:
          type: integer
        total_pages:
          type: integer
        total_count:
          type: integer
        per_page:
          type: integer
      required:
      - current_page
      - total_pages
      - total_count
      - per_page
