---
openapi: 3.0.1
info:
  title: Fudo Consumers API
  version: v1
  description: 'Consumer-facing API for the Fudo restaurant/bar/cafe discovery app:
    catalog browsing, loyalty, visits, favorites, gifts, and natural-language search.'
paths:
  "/api/v1/business_hours":
    get:
      summary: Lists business hours
      tags:
      - BusinessHours
      description: Public — no authentication required.
      parameters:
      - name: merchant_id
        in: query
        schema:
          type: integer
        required: false
        description: Filter by merchant
      - name: page
        in: query
        schema:
          type: integer
        required: false
      - name: per_page
        in: query
        schema:
          type: integer
        required: false
      responses:
        '200':
          description: business hours found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        merchant_id:
                          type: integer
                        day_of_week:
                          type: string
                          enum:
                          - monday
                          - tuesday
                          - wednesday
                          - thursday
                          - friday
                          - saturday
                          - sunday
                        opens_at:
                          type: string
                          nullable: true
                        closes_at:
                          type: string
                          nullable: true
                        closed:
                          type: boolean
                      required:
                      - id
                      - merchant_id
                      - day_of_week
                      - closed
                  meta:
                    "$ref": "#/components/schemas/pagination_meta"
                required:
                - data
                - meta
    post:
      summary: Creates a business hour
      tags:
      - BusinessHours
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '201':
          description: business hour created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  merchant_id:
                    type: integer
                  day_of_week:
                    type: string
                    enum:
                    - monday
                    - tuesday
                    - wednesday
                    - thursday
                    - friday
                    - saturday
                    - sunday
                  opens_at:
                    type: string
                    nullable: true
                  closes_at:
                    type: string
                    nullable: true
                  closed:
                    type: boolean
                required:
                - id
                - merchant_id
                - day_of_week
                - closed
        '401':
          description: not authenticated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '422':
          description: validation failed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                business_hour:
                  type: object
                  properties:
                    merchant_id:
                      type: integer
                    day_of_week:
                      type: string
                      enum:
                      - monday
                      - tuesday
                      - wednesday
                      - thursday
                      - friday
                      - saturday
                      - sunday
                    opens_at:
                      type: string
                    closes_at:
                      type: string
                    closed:
                      type: boolean
                  required:
                  - merchant_id
                  - day_of_week
              required:
              - business_hour
  "/api/v1/business_hours/{id}":
    parameters:
    - name: id
      in: path
      schema:
        type: integer
      required: true
    get:
      summary: Retrieves a business hour
      tags:
      - BusinessHours
      description: Public — no authentication required.
      responses:
        '200':
          description: business hour found
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  merchant_id:
                    type: integer
                  day_of_week:
                    type: string
                    enum:
                    - monday
                    - tuesday
                    - wednesday
                    - thursday
                    - friday
                    - saturday
                    - sunday
                  opens_at:
                    type: string
                    nullable: true
                  closes_at:
                    type: string
                    nullable: true
                  closed:
                    type: boolean
                required:
                - id
                - merchant_id
                - day_of_week
                - closed
        '404':
          description: business hour not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
    patch:
      summary: Updates a business hour
      tags:
      - BusinessHours
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '200':
          description: business hour updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  merchant_id:
                    type: integer
                  day_of_week:
                    type: string
                    enum:
                    - monday
                    - tuesday
                    - wednesday
                    - thursday
                    - friday
                    - saturday
                    - sunday
                  opens_at:
                    type: string
                    nullable: true
                  closes_at:
                    type: string
                    nullable: true
                  closed:
                    type: boolean
                required:
                - id
                - merchant_id
                - day_of_week
                - closed
        '401':
          description: not authenticated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '404':
          description: business hour not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '422':
          description: validation failed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                business_hour:
                  type: object
                  properties:
                    opens_at:
                      type: string
                    closes_at:
                      type: string
                    closed:
                      type: boolean
    delete:
      summary: Deletes a business hour
      tags:
      - BusinessHours
      security:
      - bearer_auth: []
      description: Hard delete — BusinessHour has no soft-delete column.
      responses:
        '204':
          description: business hour deleted
        '401':
          description: not authenticated
        '404':
          description: business hour not found
  "/api/v1/consumer_settings":
    get:
      summary: Lists the authenticated consumer's own setting
      tags:
      - ConsumerSettings
      security:
      - bearer_auth: []
      responses:
        '200':
          description: consumer settings found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        consumer_id:
                          type: string
                        theme:
                          type: string
                          enum:
                          - light
                          - dark
                          - system
                        notifications_enabled:
                          type: boolean
                        updated_at:
                          type: string
                      required:
                      - id
                      - consumer_id
                      - theme
                      - notifications_enabled
                      - updated_at
                  meta:
                    "$ref": "#/components/schemas/pagination_meta"
                required:
                - data
                - meta
        '401':
          description: not authenticated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
    post:
      summary: Creates the authenticated consumer's setting
      tags:
      - ConsumerSettings
      security:
      - bearer_auth: []
      description: consumer_id always comes from the authenticated consumer. Each
        consumer may have at most one setting (consumer_id is unique).
      parameters: []
      responses:
        '201':
          description: consumer setting created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  consumer_id:
                    type: string
                  theme:
                    type: string
                    enum:
                    - light
                    - dark
                    - system
                  notifications_enabled:
                    type: boolean
                  updated_at:
                    type: string
                required:
                - id
                - consumer_id
                - theme
                - notifications_enabled
                - updated_at
        '401':
          description: not authenticated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '422':
          description: validation failed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                consumer_setting:
                  type: object
                  properties:
                    theme:
                      type: string
                      enum:
                      - light
                      - dark
                      - system
                    notifications_enabled:
                      type: boolean
              required:
              - consumer_setting
  "/api/v1/consumer_settings/{id}":
    parameters:
    - name: id
      in: path
      schema:
        type: integer
      required: true
    get:
      summary: Retrieves a consumer setting
      tags:
      - ConsumerSettings
      security:
      - bearer_auth: []
      description: Scoped to the authenticated consumer's own setting — another consumer's
        setting 404s.
      responses:
        '200':
          description: consumer setting found
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  consumer_id:
                    type: string
                  theme:
                    type: string
                    enum:
                    - light
                    - dark
                    - system
                  notifications_enabled:
                    type: boolean
                  updated_at:
                    type: string
                required:
                - id
                - consumer_id
                - theme
                - notifications_enabled
                - updated_at
        '401':
          description: not authenticated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '404':
          description: consumer setting not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
    patch:
      summary: Updates a consumer setting
      tags:
      - ConsumerSettings
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '200':
          description: consumer setting updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  consumer_id:
                    type: string
                  theme:
                    type: string
                    enum:
                    - light
                    - dark
                    - system
                  notifications_enabled:
                    type: boolean
                  updated_at:
                    type: string
                required:
                - id
                - consumer_id
                - theme
                - notifications_enabled
                - updated_at
        '401':
          description: not authenticated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '404':
          description: consumer setting not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                consumer_setting:
                  type: object
                  properties:
                    theme:
                      type: string
                      enum:
                      - light
                      - dark
                      - system
                    notifications_enabled:
                      type: boolean
    delete:
      summary: Deletes a consumer setting
      tags:
      - ConsumerSettings
      security:
      - bearer_auth: []
      description: Hard delete — ConsumerSetting has no soft-delete column.
      responses:
        '204':
          description: consumer setting deleted
        '401':
          description: not authenticated
        '404':
          description: consumer setting not found
  "/api/v1/favorites":
    get:
      summary: Lists the authenticated consumer's favorites
      tags:
      - Favorites
      security:
      - bearer_auth: []
      responses:
        '200':
          description: favorites found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        consumer_id:
                          type: string
                        merchant_id:
                          type: integer
                        created_at:
                          type: string
                      required:
                      - id
                      - consumer_id
                      - merchant_id
                      - created_at
                  meta:
                    "$ref": "#/components/schemas/pagination_meta"
                required:
                - data
                - meta
        '401':
          description: not authenticated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
    post:
      summary: Creates a favorite
      tags:
      - Favorites
      security:
      - bearer_auth: []
      description: consumer_id always comes from the authenticated consumer, never
        from client input.
      parameters: []
      responses:
        '201':
          description: favorite created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  consumer_id:
                    type: string
                  merchant_id:
                    type: integer
                  created_at:
                    type: string
                required:
                - id
                - consumer_id
                - merchant_id
                - created_at
        '401':
          description: not authenticated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '422':
          description: duplicate consumer/merchant pair
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
        '409':
          description: duplicate reached the DB unique index directly (race condition)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                favorite:
                  type: object
                  properties:
                    merchant_id:
                      type: integer
                  required:
                  - merchant_id
              required:
              - favorite
  "/api/v1/favorites/{id}":
    parameters:
    - name: id
      in: path
      schema:
        type: integer
      required: true
    get:
      summary: Retrieves a favorite
      tags:
      - Favorites
      security:
      - bearer_auth: []
      description: Scoped to the authenticated consumer's own favorites — another
        consumer's favorite 404s.
      responses:
        '200':
          description: favorite found
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  consumer_id:
                    type: string
                  merchant_id:
                    type: integer
                  created_at:
                    type: string
                required:
                - id
                - consumer_id
                - merchant_id
                - created_at
        '401':
          description: not authenticated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '404':
          description: favorite not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
    patch:
      summary: Updates a favorite
      tags:
      - Favorites
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '200':
          description: favorite updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  consumer_id:
                    type: string
                  merchant_id:
                    type: integer
                  created_at:
                    type: string
                required:
                - id
                - consumer_id
                - merchant_id
                - created_at
        '401':
          description: not authenticated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '404':
          description: favorite not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                favorite:
                  type: object
                  properties:
                    merchant_id:
                      type: integer
    delete:
      summary: Soft-deletes a favorite
      tags:
      - Favorites
      security:
      - bearer_auth: []
      responses:
        '204':
          description: favorite deleted
        '401':
          description: not authenticated
        '404':
          description: favorite not found
  "/api/v1/gifts":
    get:
      summary: Lists gifts where the authenticated consumer is sender or recipient
      tags:
      - Gifts
      security:
      - bearer_auth: []
      responses:
        '200':
          description: gifts found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        sender_consumer_id:
                          type: string
                        recipient_consumer_id:
                          type: string
                          nullable: true
                        type:
                          type: string
                          enum:
                          - classic
                          - gold
                          - black
                          - platinum
                        amount:
                          type: string
                        status:
                          type: string
                          enum:
                          - pending
                          - redeemed
                          - expired
                          - cancelled
                        expires_at:
                          type: string
                      required:
                      - id
                      - sender_consumer_id
                      - type
                      - amount
                      - status
                      - expires_at
                  meta:
                    "$ref": "#/components/schemas/pagination_meta"
                required:
                - data
                - meta
        '401':
          description: not authenticated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
    post:
      summary: Creates a gift
      tags:
      - Gifts
      security:
      - bearer_auth: []
      description: The authenticated consumer is always the sender. status is never
        client-settable — every new gift starts pending.
      parameters: []
      responses:
        '201':
          description: gift created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  sender_consumer_id:
                    type: string
                  recipient_consumer_id:
                    type: string
                    nullable: true
                  type:
                    type: string
                    enum:
                    - classic
                    - gold
                    - black
                    - platinum
                  amount:
                    type: string
                  status:
                    type: string
                    enum:
                    - pending
                    - redeemed
                    - expired
                    - cancelled
                  expires_at:
                    type: string
                  recipient_phone:
                    type: string
                  message:
                    type: string
                    nullable: true
                  status_updated_at:
                    type: string
                    nullable: true
                  created_at:
                    type: string
                  updated_at:
                    type: string
                required:
                - id
                - sender_consumer_id
                - type
                - amount
                - status
                - expires_at
                - recipient_phone
                - created_at
                - updated_at
        '401':
          description: not authenticated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '422':
          description: validation failed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                gift:
                  type: object
                  properties:
                    type:
                      type: string
                      enum:
                      - classic
                      - gold
                      - black
                      - platinum
                    amount:
                      type: number
                    recipient_phone:
                      type: string
                    recipient_consumer_id:
                      type: string
                    message:
                      type: string
                    expires_at:
                      type: string
                  required:
                  - type
                  - amount
                  - recipient_phone
                  - expires_at
              required:
              - gift
  "/api/v1/gifts/{id}":
    parameters:
    - name: id
      in: path
      schema:
        type: integer
      required: true
    get:
      summary: Retrieves a gift
      tags:
      - Gifts
      security:
      - bearer_auth: []
      description: Scoped to gifts where the authenticated consumer is sender or recipient
        — otherwise 404.
      responses:
        '200':
          description: gift found
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  sender_consumer_id:
                    type: string
                  recipient_consumer_id:
                    type: string
                    nullable: true
                  type:
                    type: string
                    enum:
                    - classic
                    - gold
                    - black
                    - platinum
                  amount:
                    type: string
                  status:
                    type: string
                    enum:
                    - pending
                    - redeemed
                    - expired
                    - cancelled
                  expires_at:
                    type: string
                  recipient_phone:
                    type: string
                  message:
                    type: string
                    nullable: true
                  status_updated_at:
                    type: string
                    nullable: true
                  created_at:
                    type: string
                  updated_at:
                    type: string
                required:
                - id
                - sender_consumer_id
                - type
                - amount
                - status
                - expires_at
                - recipient_phone
                - created_at
                - updated_at
        '401':
          description: not authenticated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '404':
          description: gift not found (or the consumer has no part in it)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
    patch:
      summary: Updates a gift
      tags:
      - Gifts
      security:
      - bearer_auth: []
      description: 'Gifts are immutable except for one case: the sender cancelling
        their own still-pending gift by setting status to "cancelled". Marking a gift
        redeemed is NOT a consumer-facing action.'
      parameters: []
      responses:
        '200':
          description: gift cancelled by its sender
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  sender_consumer_id:
                    type: string
                  recipient_consumer_id:
                    type: string
                    nullable: true
                  type:
                    type: string
                    enum:
                    - classic
                    - gold
                    - black
                    - platinum
                  amount:
                    type: string
                  status:
                    type: string
                    enum:
                    - pending
                    - redeemed
                    - expired
                    - cancelled
                  expires_at:
                    type: string
                  recipient_phone:
                    type: string
                  message:
                    type: string
                    nullable: true
                  status_updated_at:
                    type: string
                    nullable: true
                  created_at:
                    type: string
                  updated_at:
                    type: string
                required:
                - id
                - sender_consumer_id
                - type
                - amount
                - status
                - expires_at
                - recipient_phone
                - created_at
                - updated_at
        '401':
          description: not authenticated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '403':
          description: the recipient (not the sender) tried to update the gift
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '404':
          description: gift not found (or the consumer has no part in it)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '422':
          description: gift can no longer be cancelled (already redeemed/expired/cancelled)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                gift:
                  type: object
                  properties:
                    status:
                      type: string
                      enum:
                      - cancelled
                  required:
                  - status
              required:
              - gift
    delete:
      summary: Soft-deletes a gift
      tags:
      - Gifts
      security:
      - bearer_auth: []
      description: 'Only the sender may delete their own gift, and only while it is
        still pending — deleting hides the gift from BOTH sender and recipient (Gift''s
        soft-delete scope is global), so this is deliberately as restricted as #update''s
        cancel path.'
      responses:
        '204':
          description: gift deleted
        '401':
          description: not authenticated
        '403':
          description: the recipient (not the sender) tried to delete the gift
        '404':
          description: gift not found (or the consumer has no part in it)
        '422':
          description: gift is no longer pending and can no longer be deleted
  "/api/v1/loyalty_rules":
    get:
      summary: Lists loyalty rules
      tags:
      - LoyaltyRules
      description: Public — no authentication required.
      parameters:
      - name: merchant_id
        in: query
        schema:
          type: integer
        required: false
        description: Filter by merchant
      - name: page
        in: query
        schema:
          type: integer
        required: false
      - name: per_page
        in: query
        schema:
          type: integer
        required: false
      responses:
        '200':
          description: loyalty rules found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        merchant_id:
                          type: integer
                        visits_required:
                          type: integer
                        reward_type:
                          type: string
