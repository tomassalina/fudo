  "/api/v1/search":
    post:
      summary: Parses a free-text query into merchant filters and returns matching
        merchants
      tags:
      - Search
      security:
      - bearer_auth: []
      description: Persists the query and its parsed filters to the authenticated
        consumer's search history (SearchHistory), then filters merchants the same
        way GET /api/v1/merchants does.
      parameters: []
      responses:
        '200':
          description: query parsed and matching merchants returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        type:
                          type: string
                          enum:
                          - restaurant
                          - cafe
                          - bar
                          - dark_kitchen
                          - pizzeria
                          - brewery
                          - food_truck
                          - other
                        neighborhood:
                          type: string
                          nullable: true
                        city:
                          type: string
                        price_per_person_min:
                          type: string
                          nullable: true
                        price_per_person_max:
                          type: string
                          nullable: true
                        cover_image_url:
                          type: string
                          nullable: true
                        latitude:
                          type: string
                        longitude:
                          type: string
                      required:
                      - id
                      - name
                      - type
                      - city
                      - latitude
                      - longitude
                  meta:
                    "$ref": "#/components/schemas/pagination_meta"
                  filters:
                    type: object
                    description: The structured filters Gemini derived from the free-text
                      query (same shape as SearchHistory#structured_output) — lets
                      a client build a shareable /buscar?type=...&hood=...&open=now&reward=1
                      URL out of a natural-language search.
                    properties:
                      neighborhood:
                        type: string
                        nullable: true
                      type:
                        type: string
                        nullable: true
                        enum:
                        - restaurant
                        - cafe
                        - bar
                        - dark_kitchen
                        - pizzeria
                        - brewery
                        - food_truck
                        - other
                      tags:
                        type: array
                        items:
                          type: string
                          enum:
                          - sin_tacc
                          - vegano
                          - vegetariano
                          - picante
                          - economico
                      price_per_person:
                        type: number
                        nullable: true
                      open:
                        type: boolean
                        nullable: true
                        description: '"Abierto ahora" — maps onto /buscar''s open=now
                          param.'
                      reward:
                        type: boolean
                        nullable: true
                        description: '"Premio por visitas" — maps onto /buscar''s
                          reward=1 param.'
                    required:
                    - neighborhood
                    - type
                    - tags
                    - price_per_person
                    - open
                    - reward
                required:
                - data
                - meta
                - filters
        '401':
          description: not authenticated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '400':
          description: query is missing
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '502':
          description: the search parsing service (Gemini) is unavailable
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
              required:
              - query
