# PostgreSQL. Versions 9.3 and up are supported.
#
# Install the pg driver:
#   gem install pg
# On macOS with Homebrew:
#   gem install pg -- --with-pg-config=/usr/local/bin/pg_config
# On Windows:
#   gem install pg
#       Choose the win32 build.
#       Install PostgreSQL and put its /bin directory on your path.
#
# Configure Using Gemfile
# gem "pg"
#
default: &default
  adapter: postgresql
  encoding: unicode
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST") { "localhost" } %>
  port: <%= ENV.fetch("DB_PORT") { 5432 } %>
  username: <%= ENV.fetch("POSTGRES_USER") { "fudo" } %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD") { "fudo_password" } %>

development:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB") { "fudo_consumers_development" } %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_TEST_DB") { "fudo_consumers_test" } %>

# As with config/credentials.yml, you never want to store sensitive information,
# like your database password, in your source code. Configuration here is
# fully driven by environment variables (see docker-compose.yml / .env).
production:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB") { "fudo_consumers_production" } %>
