services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fudo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fudo_password}
      POSTGRES_DB: ${POSTGRES_DB:-fudo_consumers_development}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fudo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: ${RAILS_ENV:-development}
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-fudo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fudo_password}
      POSTGRES_DB: ${POSTGRES_DB:-fudo_consumers_development}
    volumes:
      - .:/rails

volumes:
  postgres_data:
